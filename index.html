<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Pawnly walkthrough</title>
<style>
  :root {
    --bg: #faf8f5;
    --fg: #1f1d1a;
    --muted: #5c574f;
    --accent: #b45309;
    --frame: #e7e2da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161514;
      --fg: #f2efea;
      --muted: #a8a29a;
      --accent: #f59e0b;
      --frame: #2b2927;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 16px 48px;
    text-align: center;
  }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 auto 24px; max-width: 520px; }
  video {
    display: block;
    width: 100%;
    max-width: 420px;
    margin: 0 auto 20px;
    border-radius: 20px;
    background: var(--frame);
  }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Pawnly walkthrough</h1>
  <p>Screen recording of Pawnly on an iPhone 13 Pro Max running iOS 26.6.2, build 1.0 (2). It shows launch, onboarding, a lesson, the opening guides, progress, the Chess.com import and the Pro paywall with its three plans.</p>
  <video src="review.mp4" controls playsinline preload="metadata"></video>
  <a href="review.mp4" download>Download the video (MP4)</a>
</main>
</body>
</html>
